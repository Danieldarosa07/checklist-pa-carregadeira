</style></head><body><main class="wrap"><div class="sheet" id="sheet">
<input class="field operator" id="operator" placeholder="" aria-label="Operador">

<script>
const componentNames=["Retrovisores","Pistões Hidráulicos","Mangueiras","Concha","Pneus Dianteiros","Luzes","Red Zone","Banco e encosto","Comando de movimentação","Pneus Traseiros"];
const componentPositions=[
[3.9,10.35],[3.9,15.65],[3.9,20.95],[3.9,26.15],[3.9,31.55],
[90.8,10.35],[90.8,15.65],[90.8,20.95],[90.8,26.15],[90.8,31.55]
];
document.querySelectorAll("[data-component]").forEach(el=>{let i=+el.dataset.component;el.style.left=componentPositions[i][0]+"%";el.style.top=componentPositions[i][1]+"%";el.title=componentNames[i]});
document.querySelectorAll("[data-question]").forEach(el=>{let i=+el.dataset.question;el.style.left="89.7%";el.style.top=(39.25+i*2.08)+"%"});
const keys=["operator","observations","date","shift","equipment","hourmeter"];
function snap(){let d={};keys.forEach(k=>d[k]=document.getElementById(k).value);d.components={};d.answers={};document.querySelectorAll("[data-component]").forEach(e=>d.components[e.dataset.component]=e.value);document.querySelectorAll("[data-question]").forEach(e=>d.answers[e.dataset.question]=e.value);return d}
function apply(d){if(!d)return;keys.forEach(k=>document.getElementById(k).value=d[k]||"");document.querySelectorAll("[data-component]").forEach(e=>e.value=d.components?.[e.dataset.component]||"");document.querySelectorAll("[data-question]").forEach(e=>e.value=d.answers?.[e.dataset.question]||"")}
function hist(){try{return JSON.parse(localStorage.getItem("pa-loader-checks")||"[]")}catch{return []}}
const msg=document.getElementById("msg");
document.querySelectorAll(".component,.qanswer").forEach(el=>{el.maxLength=2;el.addEventListener("input",()=>{el.value=el.value.toUpperCase().replace(/[^CNA]/g,"").slice(0,2);el.style.color=el.value==="C"?"#1769d2":(el.value==="N"||el.value==="NC")?"#d62f36":el.value==="NA"?"#68717c":"#111"})});
document.getElementById("save").onclick=()=>{let h=hist();h.unshift({...snap(),savedAt:new Date().toISOString()});localStorage.setItem("pa-loader-checks",JSON.stringify(h.slice(0,100)));msg.textContent="Inspeção salva neste dispositivo."};
document.getElementById("repeat").onclick=()=>{let h=hist();if(!h.length){msg.textContent="Nenhuma inspeção salva ainda.";return}apply(h[0]);msg.textContent="Última inspeção carregada. Confira data e horímetro."};
document.getElementById("history").onclick=()=>{let h=hist();msg.textContent=h.length?"Inspeções salvas neste dispositivo: "+h.length:"Nenhuma inspeção salva."};
document.getElementById("export").onclick=async()=>{try{if(!window.html2canvas)await new Promise((ok,no)=>{let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});let c=await html2canvas(document.getElementById("sheet"),{scale:2,backgroundColor:"#fff"});let a=document.createElement("a");a.download="checklist-pa-carregadeira.png";a.href=c.toDataURL("image/png");a.click();msg.textContent="Imagem exportada."}catch(e){msg.textContent="Falha na exportação. Use Imprimir > Salvar em PDF.";window.print()}};
</script></body></html>
